name: Publish Quarto site

# Renders this repo and pushes the built site to the gh-pages branch of
# SolomonMg/SolomonMg.github.io, which serves https://solomonmg.github.io/.
# Auth: write deploy key on SolomonMg.github.io; private half stored here as
# the ACTIONS_DEPLOY_KEY secret.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Push to SolomonMg.github.io gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: SolomonMg/SolomonMg.github.io
          publish_branch: gh-pages
          publish_dir: ./_site
